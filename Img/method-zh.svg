<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <title>智能体辅助归约构造过程</title>
  <desc>基础代码智能体构造归约证明实现，NPC 归约评测框架返回反例和错误，通过实例检验后整理为数学证明。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .head { font: 600 34px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #ffffff; }
      .label { font: 600 27px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #1f2937; }
      .body { font: 400 23px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #344258; }
      .small { font: 400 19px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #526177; }
      .formula { font: 500 27px "Times New Roman", "Songti SC", serif; fill: #172033; }
      .arrow-label { font: 500 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #475569; }
      .panel { stroke-width: 2.2; }
      .inner { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="720" fill="#ffffff"/>

  <rect class="panel" x="55" y="65" width="430" height="390" rx="12" fill="#edf3f8" stroke="#42627f"/>
  <rect x="55" y="65" width="430" height="72" rx="12" fill="#42627f"/>
  <path d="M55 123 H485 V137 H55 Z" fill="#42627f"/>
  <text class="head" x="270" y="111" text-anchor="middle">基础代码智能体</text>
  <text class="label" x="90" y="185">输入</text>
  <rect class="inner" x="85" y="205" width="370" height="78" rx="7"/>
  <text class="body" x="270" y="238" text-anchor="middle">目标问题定义、已有知识</text>
  <text class="body" x="270" y="268" text-anchor="middle">以及上一轮反馈</text>
  <text class="label" x="90" y="330">归约构造</text>
  <text class="body" x="112" y="367">选择已知 NP 困难源问题</text>
  <text class="body" x="112" y="403">构造并修改归约映射 f</text>

  <path class="arrow" d="M500 260 H555"/>
  <text class="arrow-label" x="527" y="235" text-anchor="middle">提交</text>

  <rect class="panel" x="570" y="65" width="460" height="390" rx="12" fill="#fbf3eb" stroke="#a45d38"/>
  <rect x="570" y="65" width="460" height="72" rx="12" fill="#a45d38"/>
  <path d="M570 123 H1030 V137 H570 Z" fill="#a45d38"/>
  <text class="head" x="800" y="111" text-anchor="middle">归约证明实现</text>
  <rect class="inner" x="610" y="185" width="380" height="122" rx="7"/>
  <text class="formula" x="680" y="256" text-anchor="middle">L₁</text>
  <path class="arrow" d="M720 246 H870"/>
  <text class="formula" x="795" y="226" text-anchor="middle">f</text>
  <text class="formula" x="925" y="256" text-anchor="middle">L₂</text>
  <text class="body" x="800" y="357" text-anchor="middle">程序化表示映射 f(x)</text>
  <text class="small" x="800" y="393" text-anchor="middle">最终映射不调用实例判定器</text>

  <path class="arrow" d="M1045 260 H1100"/>
  <text class="arrow-label" x="1072" y="235" text-anchor="middle">检验</text>

  <rect class="panel" x="1115" y="65" width="430" height="390" rx="12" fill="#f1f5f3" stroke="#4e8069"/>
  <rect x="1115" y="65" width="430" height="72" rx="12" fill="#4e8069"/>
  <path d="M1115 123 H1545 V137 H1115 Z" fill="#4e8069"/>
  <text class="head" x="1330" y="111" text-anchor="middle">NPC 归约评测框架</text>
  <text class="body" x="1158" y="192">执行归约映射 f(x)</text>
  <text class="body" x="1158" y="232">检查输出格式与运行状态</text>
  <text class="body" x="1158" y="272">比较源、目标实例判定结果</text>
  <rect class="inner" x="1150" y="306" width="360" height="86" rx="7"/>
  <text class="formula" x="1330" y="359" text-anchor="middle">oracle_L₁(x) = oracle_L₂(f(x))</text>
  <text class="small" x="1330" y="424" text-anchor="middle">生成反例、格式错误或运行错误</text>

  <path class="arrow" d="M1330 470 V505 H270 V470"/>
  <rect x="612" y="480" width="376" height="38" rx="5" fill="#ffffff"/>
  <text class="arrow-label" x="800" y="506" text-anchor="middle">返回反例与错误，继续修正</text>

  <path class="arrow" d="M1330 455 V610 H1090"/>
  <text class="arrow-label" x="1370" y="548">实例检验通过</text>

  <rect class="panel" x="510" y="565" width="580" height="115" rx="10" fill="#f2f4f8" stroke="#59677d"/>
  <text class="label" x="800" y="610" text-anchor="middle">数学证明整理</text>
  <text class="body" x="800" y="649" text-anchor="middle">两个蕴含方向　多项式时间　输出规模</text>
</svg>
